<text x="18" y="794.8" xml:space="preserve"><tspan fill="#6e6249">35 </tspan><tspan fill="#2b2313">      format(</tspan><tspan fill="#ad8600">"</tspan><tspan fill="#ad8600">%&lt;name&gt;s owes %&lt;total&gt;.2f %&lt;cur&gt;s</tspan><tspan fill="#ad8600">"</tspan><tspan fill="#2b2313">,</tspan></text>
<text x="18" y="815.8" xml:space="preserve"><tspan fill="#6e6249">36 </tspan><tspan fill="#2b2313">             </tspan><tspan fill="#a76c01">name</tspan><tspan fill="#2b2313">: </tspan><tspan fill="#c83e01">@customer</tspan><tspan fill="#2b2313">.name, </tspan><tspan fill="#a76c01">total</tspan><tspan fill="#2b2313">: total / </tspan><tspan fill="#791dc7">100.0</tspan><tspan fill="#2b2313">, </tspan><tspan fill="#a76c01">cur</tspan><tspan fill="#2b2313">: </tspan><tspan fill="#c83e01">@currency</tspan><tspan fill="#2b2313">.to_s.upcase)</tspan></text>
<text x="18" y="836.8" xml:space="preserve"><tspan fill="#6e6249">37 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#bb0916">end</tspan></text>
<text x="18" y="857.8" xml:space="preserve"><tspan fill="#6e6249">38 </tspan><tspan fill="#2b2313">  </tspan><tspan fill="#bb0916">end</tspan></text>
