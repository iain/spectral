<text x="18" y="458.8" xml:space="preserve"><tspan fill="#6e6249">19 </tspan><tspan fill="#2b2313">      </tspan><tspan fill="#bb0916">raise</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#007a85">ArgumentError</tspan><tspan fill="#2b2313">, </tspan><tspan fill="#ad8600">"</tspan><tspan fill="#ad8600">unknown currency </tspan><tspan fill="#c83e01">#{</tspan><tspan fill="#007a85">currency</tspan><tspan fill="#c83e01">}</tspan><tspan fill="#ad8600">"</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#bb0916">unless</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#007a85">CURRENCIES</tspan><tspan fill="#2b2313">.include?(currency)</tspan></text>
<text x="18" y="479.8" xml:space="preserve"><tspan fill="#6e6249">20 </tspan></text>
<text x="18" y="500.8" xml:space="preserve"><tspan fill="#6e6249">21 </tspan><tspan fill="#2b2313">      </tspan><tspan fill="#c83e01">@customer</tspan><tspan fill="#2b2313"> = customer</tspan></text>
<text x="18" y="521.8" xml:space="preserve"><tspan fill="#6e6249">22 </tspan><tspan fill="#2b2313">      </tspan><tspan fill="#c83e01">@currency</tspan><tspan fill="#2b2313"> = currency</tspan></text>
<text x="18" y="542.8" xml:space="preserve"><tspan fill="#6e6249">23 </tspan><tspan fill="#2b2313">      </tspan><tspan fill="#c83e01">@lines</tspan><tspan fill="#2b2313">    = []</tspan></text>
<text x="18" y="563.8" xml:space="preserve"><tspan fill="#6e6249">24 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#bb0916">end</tspan></text>
<text x="18" y="584.8" xml:space="preserve"><tspan fill="#6e6249">25 </tspan></text>
<text x="18" y="605.8" xml:space="preserve"><tspan fill="#6e6249">26 </tspan><tspan fill="#6e6249">    sig { params(description: String, cents: Integer).returns(T.self_type) }</tspan></text>
<text x="18" y="626.8" xml:space="preserve"><tspan fill="#6e6249">27 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#bb0916">def</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#1a7f11">add</tspan><tspan fill="#2b2313">(description, cents)</tspan></text>
<text x="18" y="647.8" xml:space="preserve"><tspan fill="#6e6249">28 </tspan><tspan fill="#2b2313">      </tspan><tspan fill="#bb0916">return</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#791dc7">self</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#bb0916">if</tspan><tspan fill="#2b2313"> cents.zero?</tspan></text>
<text x="18" y="668.8" xml:space="preserve"><tspan fill="#6e6249">29 </tspan></text>
<text x="18" y="689.8" xml:space="preserve"><tspan fill="#6e6249">30 </tspan><tspan fill="#2b2313">      </tspan><tspan fill="#c83e01">@lines</tspan><tspan fill="#2b2313"> &lt;&lt; { </tspan><tspan fill="#a76c01">description</tspan><tspan fill="#2b2313">: description, </tspan><tspan fill="#a76c01">cents</tspan><tspan fill="#2b2313">: cents, </tspan><tspan fill="#a76c01">added_at</tspan><tspan fill="#2b2313">: </tspan><tspan fill="#007a85">Time</tspan><tspan fill="#2b2313">.now }</tspan></text>
