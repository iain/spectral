<text x="425" y="19" text-anchor="middle" fill="#5d5139" font-size="11">billing.rb</text>
<text x="18" y="59.8" xml:space="preserve"></text>
<text x="18" y="80.8" xml:space="preserve"><tspan fill="#6e6249"> 1 </tspan><tspan fill="#6e6249" font-style="italic"># </tspan><tspan fill="#5d5139" font-style="italic">frozen_string_literal:</tspan><tspan fill="#6e6249" font-style="italic"> </tspan><tspan fill="#65389f">true</tspan></text>
