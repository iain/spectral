<text x="18" y="122.8" xml:space="preserve"><tspan fill="#6e6249"> 3 </tspan><tspan fill="#bb0916">require</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#ad8600">"</tspan><tspan fill="#ad8600">money</tspan><tspan fill="#ad8600">"</tspan></text>
<text x="18" y="143.8" xml:space="preserve"><tspan fill="#6e6249"> 4 </tspan></text>
<text x="18" y="164.8" xml:space="preserve"><tspan fill="#6e6249"> 5 </tspan><tspan fill="#bb0916">module</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#007a85">Billing</tspan></text>
<text x="18" y="185.8" xml:space="preserve"><tspan fill="#6e6249"> 6 </tspan><tspan fill="#2b2313">  </tspan><tspan fill="#6e6249" font-style="italic"># Adds VAT to a set of line items and renders an invoice total.</tspan></text>
<text x="18" y="206.8" xml:space="preserve"><tspan fill="#6e6249"> 7 </tspan><tspan fill="#2b2313">  </tspan><tspan fill="#bb0916">class</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#007a85">InvoiceCalculator</tspan></text>
<text x="18" y="227.8" xml:space="preserve"><tspan fill="#6e6249"> 8 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#6e6249">extend T::Sig</tspan></text>
<text x="18" y="248.8" xml:space="preserve"><tspan fill="#6e6249"> 9 </tspan></text>
<text x="18" y="269.8" xml:space="preserve"><tspan fill="#6e6249">10 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#007a85">VAT_RATE</tspan><tspan fill="#2b2313"> = </tspan><tspan fill="#791dc7">0.21</tspan></text>
<text x="18" y="290.8" xml:space="preserve"><tspan fill="#6e6249">11 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#007a85">CURRENCIES</tspan><tspan fill="#2b2313"> = </tspan><tspan fill="#a76c01">%i[</tspan><tspan fill="#a76c01">eur gbp usd</tspan><tspan fill="#a76c01">]</tspan><tspan fill="#2b2313">.freeze</tspan></text>
<text x="18" y="311.8" xml:space="preserve"><tspan fill="#6e6249">12 </tspan></text>
<text x="18" y="332.8" xml:space="preserve"><tspan fill="#6e6249">13 </tspan><tspan fill="#6e6249">    sig { params(items: T::Array[LineItem]).returns(Money) }</tspan></text>
<text x="18" y="353.8" xml:space="preserve"><tspan fill="#6e6249">14 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#bb0916">def</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#791dc7">self</tspan><tspan fill="#2b2313">.</tspan><tspan fill="#1a7f11">total_for</tspan><tspan fill="#2b2313">(items)</tspan></text>
<text x="18" y="374.8" xml:space="preserve"><tspan fill="#6e6249">15 </tspan><tspan fill="#2b2313">      items.sum(</tspan><tspan fill="#007a85">Money</tspan><tspan fill="#2b2313">.zero) { </tspan><tspan fill="#c83e01">|item|</tspan><tspan fill="#2b2313"> item.amount * (</tspan><tspan fill="#791dc7">1</tspan><tspan fill="#2b2313"> + </tspan><tspan fill="#007a85">VAT_RATE</tspan><tspan fill="#2b2313">) }</tspan></text>
<text x="18" y="395.8" xml:space="preserve"><tspan fill="#6e6249">16 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#bb0916">end</tspan></text>
