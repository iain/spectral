<text x="425" y="19" text-anchor="middle" fill="#7b7463" font-size="11">billing.rb</text>
<text x="18" y="59.8" xml:space="preserve"></text>
<text x="18" y="80.8" xml:space="preserve"><tspan fill="#5e574a"> 1 </tspan><tspan fill="#5e574a" font-style="italic"># </tspan><tspan fill="#7b7463" font-style="italic">frozen_string_literal:</tspan><tspan fill="#5e574a" font-style="italic"> </tspan><tspan fill="#cc77df">true</tspan></text>
