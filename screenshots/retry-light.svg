<svg xmlns="http://www.w3.org/2000/svg" width="716" height="898" viewBox="0 0 716 898" font-family="'JetBrains Mono', 'JetBrainsMono Nerd Font', 'Fira Code', 'Cascadia Code', 'IBM Plex Mono', 'Source Code Pro', 'Hack', 'Iosevka', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14.0">
<rect width="716" height="898" rx="8.0" fill="#fffaee"/>
<rect width="716" height="30.0" rx="8.0" fill="#f6ead1"/>
<rect y="8.0" width="716" height="22.0" fill="#f6ead1"/>
<circle cx="16" cy="15" r="4.5" fill="#bb0916"/>
<circle cx="31" cy="15" r="4.5" fill="#ad8600"/>
<circle cx="46" cy="15" r="4.5" fill="#1a7f11"/>
<text x="358" y="19" text-anchor="middle" fill="#5d5139" font-size="11">retry.py</text>
<text x="18" y="59.8" xml:space="preserve"></text>
<text x="18" y="80.8" xml:space="preserve"><tspan fill="#6e6249"> 1 </tspan><tspan fill="#ad8600">"""</tspan><tspan fill="#ad8600">Exponential backoff with jitter, because the network is not your friend.</tspan><tspan fill="#ad8600">"""</tspan></text>
<text x="18" y="101.8" xml:space="preserve"><tspan fill="#6e6249"> 2 </tspan></text>
<text x="18" y="122.8" xml:space="preserve"><tspan fill="#6e6249"> 3 </tspan><tspan fill="#bb0916">from</tspan><tspan fill="#2b2313"> __future__ </tspan><tspan fill="#bb0916">import</tspan><tspan fill="#2b2313"> annotations</tspan></text>
<text x="18" y="143.8" xml:space="preserve"><tspan fill="#6e6249"> 4 </tspan></text>
<text x="18" y="164.8" xml:space="preserve"><tspan fill="#6e6249"> 5 </tspan><tspan fill="#bb0916">import</tspan><tspan fill="#2b2313"> random</tspan></text>
<text x="18" y="185.8" xml:space="preserve"><tspan fill="#6e6249"> 6 </tspan><tspan fill="#bb0916">import</tspan><tspan fill="#2b2313"> time</tspan></text>
<text x="18" y="206.8" xml:space="preserve"><tspan fill="#6e6249"> 7 </tspan><tspan fill="#bb0916">from</tspan><tspan fill="#2b2313"> dataclasses </tspan><tspan fill="#bb0916">import</tspan><tspan fill="#2b2313"> dataclass, field</tspan></text>
<text x="18" y="227.8" xml:space="preserve"><tspan fill="#6e6249"> 8 </tspan></text>
<text x="18" y="248.8" xml:space="preserve"><tspan fill="#6e6249"> 9 </tspan><tspan fill="#2b2313">MAX_ATTEMPTS = </tspan><tspan fill="#791dc7">5</tspan></text>
<text x="18" y="269.8" xml:space="preserve"><tspan fill="#6e6249">10 </tspan><tspan fill="#2b2313">BASE_DELAY = </tspan><tspan fill="#791dc7">0.25</tspan></text>
<text x="18" y="290.8" xml:space="preserve"><tspan fill="#6e6249">11 </tspan></text>
<text x="18" y="311.8" xml:space="preserve"><tspan fill="#6e6249">12 </tspan></text>
<text x="18" y="332.8" xml:space="preserve"><tspan fill="#6e6249">13 </tspan><tspan fill="#a76c01">@</tspan><tspan fill="#1a7f11">dataclass</tspan><tspan fill="#2b2313">(slots=</tspan><tspan fill="#1a7f11">True</tspan><tspan fill="#2b2313">)</tspan></text>
<text x="18" y="353.8" xml:space="preserve"><tspan fill="#6e6249">14 </tspan><tspan fill="#bb0916">class</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#007a85">RetryPolicy</tspan><tspan fill="#2b2313">:</tspan></text>
<text x="18" y="374.8" xml:space="preserve"><tspan fill="#6e6249">15 </tspan><tspan fill="#2b2313">    attempts: </tspan><tspan fill="#007a85">int</tspan><tspan fill="#2b2313"> = MAX_ATTEMPTS</tspan></text>
<text x="18" y="395.8" xml:space="preserve"><tspan fill="#6e6249">16 </tspan><tspan fill="#2b2313">    base: </tspan><tspan fill="#007a85">float</tspan><tspan fill="#2b2313"> = BASE_DELAY</tspan></text>
<text x="18" y="416.8" xml:space="preserve"><tspan fill="#6e6249">17 </tspan><tspan fill="#2b2313">    retry_on: </tspan><tspan fill="#007a85">tuple</tspan><tspan fill="#2b2313">[</tspan><tspan fill="#007a85">type</tspan><tspan fill="#2b2313">[</tspan><tspan fill="#007a85">Exception</tspan><tspan fill="#2b2313">], </tspan><tspan fill="#007a85">...</tspan><tspan fill="#2b2313">] = (</tspan><tspan fill="#007a85">TimeoutError</tspan><tspan fill="#2b2313">, </tspan><tspan fill="#007a85">ConnectionError</tspan><tspan fill="#2b2313">)</tspan></text>
<text x="18" y="437.8" xml:space="preserve"><tspan fill="#6e6249">18 </tspan><tspan fill="#2b2313">    _clock: </tspan><tspan fill="#007a85">callable</tspan><tspan fill="#2b2313"> = field(default=time.monotonic, </tspan><tspan fill="#007a85">repr</tspan><tspan fill="#2b2313">=</tspan><tspan fill="#1a7f11">False</tspan><tspan fill="#2b2313">)</tspan></text>
<text x="18" y="458.8" xml:space="preserve"><tspan fill="#6e6249">19 </tspan></text>
<text x="18" y="479.8" xml:space="preserve"><tspan fill="#6e6249">20 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#a76c01">@</tspan><tspan fill="#1a7f11">property</tspan></text>
<text x="18" y="500.8" xml:space="preserve"><tspan fill="#6e6249">21 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#bb0916">def</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#1a7f11">max_delay</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">) -&gt; </tspan><tspan fill="#007a85">float</tspan><tspan fill="#2b2313">:</tspan></text>
<text x="18" y="521.8" xml:space="preserve"><tspan fill="#6e6249">22 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#ad8600">"""</tspan><tspan fill="#ad8600">Longest wait this policy can produce, for logging and tests.</tspan><tspan fill="#ad8600">"""</tspan></text>
<text x="18" y="542.8" xml:space="preserve"><tspan fill="#6e6249">23 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#bb0916">return</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">.base * (</tspan><tspan fill="#791dc7">2</tspan><tspan fill="#2b2313"> ** (</tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">.attempts - </tspan><tspan fill="#791dc7">1</tspan><tspan fill="#2b2313">))</tspan></text>
<text x="18" y="563.8" xml:space="preserve"><tspan fill="#6e6249">24 </tspan></text>
<text x="18" y="584.8" xml:space="preserve"><tspan fill="#6e6249">25 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#bb0916">def</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#1a7f11">delay_for</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">, attempt: </tspan><tspan fill="#007a85">int</tspan><tspan fill="#2b2313">) -&gt; </tspan><tspan fill="#007a85">float</tspan><tspan fill="#2b2313">:</tspan></text>
<text x="18" y="605.8" xml:space="preserve"><tspan fill="#6e6249">26 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#ad8600">"""</tspan><tspan fill="#ad8600">Full-jitter backoff: uniform over [0, base * 2**attempt].</tspan><tspan fill="#ad8600">"""</tspan></text>
<text x="18" y="626.8" xml:space="preserve"><tspan fill="#6e6249">27 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#bb0916">if</tspan><tspan fill="#2b2313"> attempt &lt; </tspan><tspan fill="#791dc7">0</tspan><tspan fill="#2b2313">:</tspan></text>
<text x="18" y="647.8" xml:space="preserve"><tspan fill="#6e6249">28 </tspan><tspan fill="#2b2313">            </tspan><tspan fill="#bb0916">raise</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#007a85">ValueError</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#ad8600">f"</tspan><tspan fill="#ad8600">attempt must be non-negative, got </tspan><tspan fill="#007a85">{</tspan><tspan fill="#2b2313">attempt</tspan><tspan fill="#007a85">!r}</tspan><tspan fill="#ad8600">"</tspan><tspan fill="#2b2313">)</tspan></text>
<text x="18" y="668.8" xml:space="preserve"><tspan fill="#6e6249">29 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#bb0916">return</tspan><tspan fill="#2b2313"> random.uniform(</tspan><tspan fill="#791dc7">0.0</tspan><tspan fill="#2b2313">, </tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">.base * (</tspan><tspan fill="#791dc7">2</tspan><tspan fill="#2b2313"> ** attempt))</tspan></text>
<text x="18" y="689.8" xml:space="preserve"><tspan fill="#6e6249">30 </tspan></text>
<text x="18" y="710.8" xml:space="preserve"><tspan fill="#6e6249">31 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#bb0916">def</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#1a7f11">call</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">, fn, *args, **kwargs):</tspan></text>
<text x="18" y="731.8" xml:space="preserve"><tspan fill="#6e6249">32 </tspan><tspan fill="#2b2313">        last = </tspan><tspan fill="#1a7f11">None</tspan></text>
<text x="18" y="752.8" xml:space="preserve"><tspan fill="#6e6249">33 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#bb0916">for</tspan><tspan fill="#2b2313"> attempt </tspan><tspan fill="#bb0916">in</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#007a85">range</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">.attempts):</tspan></text>
<text x="18" y="773.8" xml:space="preserve"><tspan fill="#6e6249">34 </tspan><tspan fill="#2b2313">            </tspan><tspan fill="#bb0916">try</tspan><tspan fill="#2b2313">:</tspan></text>
<text x="18" y="794.8" xml:space="preserve"><tspan fill="#6e6249">35 </tspan><tspan fill="#2b2313">                </tspan><tspan fill="#bb0916">return</tspan><tspan fill="#2b2313"> fn(*args, **kwargs)</tspan></text>
<text x="18" y="815.8" xml:space="preserve"><tspan fill="#6e6249">36 </tspan><tspan fill="#2b2313">            </tspan><tspan fill="#bb0916">except</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">.retry_on </tspan><tspan fill="#bb0916">as</tspan><tspan fill="#2b2313"> exc:</tspan></text>
<text x="18" y="836.8" xml:space="preserve"><tspan fill="#6e6249">37 </tspan><tspan fill="#2b2313">                last = exc</tspan></text>
<text x="18" y="857.8" xml:space="preserve"><tspan fill="#6e6249">38 </tspan><tspan fill="#2b2313">                time.sleep(</tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">.delay_for(attempt))</tspan></text>
<text x="18" y="878.8" xml:space="preserve"><tspan fill="#6e6249">39 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#bb0916">raise</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#007a85">RuntimeError</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#ad8600">"</tspan><tspan fill="#ad8600">retries exhausted</tspan><tspan fill="#ad8600">"</tspan><tspan fill="#2b2313">) </tspan><tspan fill="#bb0916">from</tspan><tspan fill="#2b2313"> last</tspan></text>
</svg>
