<svg xmlns="http://www.w3.org/2000/svg" width="716" height="793" viewBox="0 0 716 793" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14.0">
<rect width="716" height="793" rx="8.0" fill="#fffaee"/>
<rect width="716" height="30.0" rx="8.0" fill="#f6ead1"/>
<rect y="8.0" width="716" height="22.0" fill="#f6ead1"/>
<circle cx="16" cy="15" r="4.5" fill="#ac1a1c"/>
<circle cx="31" cy="15" r="4.5" fill="#a98d00"/>
<circle cx="46" cy="15" r="4.5" fill="#357426"/>
<text x="358" y="19" text-anchor="middle" fill="#5d5139" font-size="11">retry.py</text>
<text x="18" y="59.8" xml:space="preserve"></text>
<text x="18" y="80.8" xml:space="preserve"><tspan fill="#6e6249"> 1 </tspan><tspan fill="#a98d00">"""</tspan><tspan fill="#a98d00">Exponential backoff with jitter, because the network is not your friend.</tspan><tspan fill="#a98d00">"""</tspan></text>
<text x="18" y="101.8" xml:space="preserve"><tspan fill="#6e6249"> 2 </tspan></text>
<text x="18" y="122.8" xml:space="preserve"><tspan fill="#6e6249"> 3 </tspan><tspan fill="#ac1a1c">from</tspan><tspan fill="#2b2313"> __future__ </tspan><tspan fill="#ac1a1c">import</tspan><tspan fill="#2b2313"> annotations</tspan></text>
<text x="18" y="143.8" xml:space="preserve"><tspan fill="#6e6249"> 4 </tspan></text>
<text x="18" y="164.8" xml:space="preserve"><tspan fill="#6e6249"> 5 </tspan><tspan fill="#ac1a1c">import</tspan><tspan fill="#2b2313"> random</tspan></text>
<text x="18" y="185.8" xml:space="preserve"><tspan fill="#6e6249"> 6 </tspan><tspan fill="#ac1a1c">import</tspan><tspan fill="#2b2313"> time</tspan></text>
<text x="18" y="206.8" xml:space="preserve"><tspan fill="#6e6249"> 7 </tspan><tspan fill="#ac1a1c">from</tspan><tspan fill="#2b2313"> dataclasses </tspan><tspan fill="#ac1a1c">import</tspan><tspan fill="#2b2313"> dataclass, field</tspan></text>
<text x="18" y="227.8" xml:space="preserve"><tspan fill="#6e6249"> 8 </tspan></text>
<text x="18" y="248.8" xml:space="preserve"><tspan fill="#6e6249"> 9 </tspan><tspan fill="#2b2313">MAX_ATTEMPTS = </tspan><tspan fill="#65389f">5</tspan></text>
<text x="18" y="269.8" xml:space="preserve"><tspan fill="#6e6249">10 </tspan><tspan fill="#2b2313">BASE_DELAY = </tspan><tspan fill="#65389f">0.25</tspan></text>
<text x="18" y="290.8" xml:space="preserve"><tspan fill="#6e6249">11 </tspan></text>
<text x="18" y="311.8" xml:space="preserve"><tspan fill="#6e6249">12 </tspan></text>
<text x="18" y="332.8" xml:space="preserve"><tspan fill="#6e6249">13 </tspan><tspan fill="#9c4700">@</tspan><tspan fill="#357426">dataclass</tspan><tspan fill="#2b2313">(slots=</tspan><tspan fill="#357426">True</tspan><tspan fill="#2b2313">)</tspan></text>
<text x="18" y="353.8" xml:space="preserve"><tspan fill="#6e6249">14 </tspan><tspan fill="#ac1a1c">class</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#00707e">RetryPolicy</tspan><tspan fill="#2b2313">:</tspan></text>
<text x="18" y="374.8" xml:space="preserve"><tspan fill="#6e6249">15 </tspan><tspan fill="#2b2313">    attempts: </tspan><tspan fill="#00707e">int</tspan><tspan fill="#2b2313"> = MAX_ATTEMPTS</tspan></text>
<text x="18" y="395.8" xml:space="preserve"><tspan fill="#6e6249">16 </tspan><tspan fill="#2b2313">    base: </tspan><tspan fill="#00707e">float</tspan><tspan fill="#2b2313"> = BASE_DELAY</tspan></text>
<text x="18" y="416.8" xml:space="preserve"><tspan fill="#6e6249">17 </tspan><tspan fill="#2b2313">    retry_on: </tspan><tspan fill="#00707e">tuple</tspan><tspan fill="#2b2313">[</tspan><tspan fill="#00707e">type</tspan><tspan fill="#2b2313">[</tspan><tspan fill="#00707e">Exception</tspan><tspan fill="#2b2313">], </tspan><tspan fill="#00707e">...</tspan><tspan fill="#2b2313">] = (</tspan><tspan fill="#00707e">TimeoutError</tspan><tspan fill="#2b2313">, </tspan><tspan fill="#00707e">ConnectionError</tspan><tspan fill="#2b2313">)</tspan></text>
<text x="18" y="437.8" xml:space="preserve"><tspan fill="#6e6249">18 </tspan><tspan fill="#2b2313">    _clock: </tspan><tspan fill="#00707e">callable</tspan><tspan fill="#2b2313"> = field(default=time.monotonic, </tspan><tspan fill="#00707e">repr</tspan><tspan fill="#2b2313">=</tspan><tspan fill="#357426">False</tspan><tspan fill="#2b2313">)</tspan></text>
<text x="18" y="458.8" xml:space="preserve"><tspan fill="#6e6249">19 </tspan></text>
<text x="18" y="479.8" xml:space="preserve"><tspan fill="#6e6249">20 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#ac1a1c">def</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#357426">delay_for</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">, attempt: </tspan><tspan fill="#00707e">int</tspan><tspan fill="#2b2313">) -&gt; </tspan><tspan fill="#00707e">float</tspan><tspan fill="#2b2313">:</tspan></text>
<text x="18" y="500.8" xml:space="preserve"><tspan fill="#6e6249">21 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#a98d00">"""</tspan><tspan fill="#a98d00">Full-jitter backoff: uniform over [0, base * 2**attempt].</tspan><tspan fill="#a98d00">"""</tspan></text>
<text x="18" y="521.8" xml:space="preserve"><tspan fill="#6e6249">22 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#ac1a1c">if</tspan><tspan fill="#2b2313"> attempt &lt; </tspan><tspan fill="#65389f">0</tspan><tspan fill="#2b2313">:</tspan></text>
<text x="18" y="542.8" xml:space="preserve"><tspan fill="#6e6249">23 </tspan><tspan fill="#2b2313">            </tspan><tspan fill="#ac1a1c">raise</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#00707e">ValueError</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#a98d00">f"</tspan><tspan fill="#a98d00">attempt must be non-negative, got </tspan><tspan fill="#00707e">{</tspan><tspan fill="#2b2313">attempt</tspan><tspan fill="#00707e">!r}</tspan><tspan fill="#a98d00">"</tspan><tspan fill="#2b2313">)</tspan></text>
<text x="18" y="563.8" xml:space="preserve"><tspan fill="#6e6249">24 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#ac1a1c">return</tspan><tspan fill="#2b2313"> random.uniform(</tspan><tspan fill="#65389f">0.0</tspan><tspan fill="#2b2313">, </tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">.base * (</tspan><tspan fill="#65389f">2</tspan><tspan fill="#2b2313"> ** attempt))</tspan></text>
<text x="18" y="584.8" xml:space="preserve"><tspan fill="#6e6249">25 </tspan></text>
<text x="18" y="605.8" xml:space="preserve"><tspan fill="#6e6249">26 </tspan><tspan fill="#2b2313">    </tspan><tspan fill="#ac1a1c">def</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#357426">call</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">, fn, *args, **kwargs):</tspan></text>
<text x="18" y="626.8" xml:space="preserve"><tspan fill="#6e6249">27 </tspan><tspan fill="#2b2313">        last = </tspan><tspan fill="#357426">None</tspan></text>
<text x="18" y="647.8" xml:space="preserve"><tspan fill="#6e6249">28 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#ac1a1c">for</tspan><tspan fill="#2b2313"> attempt </tspan><tspan fill="#ac1a1c">in</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#00707e">range</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">.attempts):</tspan></text>
<text x="18" y="668.8" xml:space="preserve"><tspan fill="#6e6249">29 </tspan><tspan fill="#2b2313">            </tspan><tspan fill="#ac1a1c">try</tspan><tspan fill="#2b2313">:</tspan></text>
<text x="18" y="689.8" xml:space="preserve"><tspan fill="#6e6249">30 </tspan><tspan fill="#2b2313">                </tspan><tspan fill="#ac1a1c">return</tspan><tspan fill="#2b2313"> fn(*args, **kwargs)</tspan></text>
<text x="18" y="710.8" xml:space="preserve"><tspan fill="#6e6249">31 </tspan><tspan fill="#2b2313">            </tspan><tspan fill="#ac1a1c">except</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">.retry_on </tspan><tspan fill="#ac1a1c">as</tspan><tspan fill="#2b2313"> exc:</tspan></text>
<text x="18" y="731.8" xml:space="preserve"><tspan fill="#6e6249">32 </tspan><tspan fill="#2b2313">                last = exc</tspan></text>
<text x="18" y="752.8" xml:space="preserve"><tspan fill="#6e6249">33 </tspan><tspan fill="#2b2313">                time.sleep(</tspan><tspan fill="#2b2313">self</tspan><tspan fill="#2b2313">.delay_for(attempt))</tspan></text>
<text x="18" y="773.8" xml:space="preserve"><tspan fill="#6e6249">34 </tspan><tspan fill="#2b2313">        </tspan><tspan fill="#ac1a1c">raise</tspan><tspan fill="#2b2313"> </tspan><tspan fill="#00707e">RuntimeError</tspan><tspan fill="#2b2313">(</tspan><tspan fill="#a98d00">"</tspan><tspan fill="#a98d00">retries exhausted</tspan><tspan fill="#a98d00">"</tspan><tspan fill="#2b2313">) </tspan><tspan fill="#ac1a1c">from</tspan><tspan fill="#2b2313"> last</tspan></text>
</svg>
