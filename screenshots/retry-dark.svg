<svg xmlns="http://www.w3.org/2000/svg" width="716" height="898" viewBox="0 0 716 898" font-family="'JetBrains Mono', 'JetBrainsMono Nerd Font', 'Fira Code', 'Cascadia Code', 'IBM Plex Mono', 'Source Code Pro', 'Hack', 'Iosevka', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14.0">
<rect width="716" height="898" rx="8.0" fill="#1a1815"/>
<rect width="716" height="30.0" rx="8.0" fill="#282622"/>
<rect y="8.0" width="716" height="22.0" fill="#282622"/>
<circle cx="16" cy="15" r="4.5" fill="#ff544c"/>
<circle cx="31" cy="15" r="4.5" fill="#f8d700"/>
<circle cx="46" cy="15" r="4.5" fill="#8def46"/>
<text x="358" y="19" text-anchor="middle" fill="#7b7463" font-size="11">retry.py</text>
<text x="18" y="59.8" xml:space="preserve"></text>
<text x="18" y="80.8" xml:space="preserve"><tspan fill="#5e574a"> 1 </tspan><tspan fill="#f8d700">"""</tspan><tspan fill="#f8d700">Exponential backoff with jitter, because the network is not your friend.</tspan><tspan fill="#f8d700">"""</tspan></text>
<text x="18" y="101.8" xml:space="preserve"><tspan fill="#5e574a"> 2 </tspan></text>
<text x="18" y="122.8" xml:space="preserve"><tspan fill="#5e574a"> 3 </tspan><tspan fill="#ff544c">from</tspan><tspan fill="#dcd0b5"> __future__ </tspan><tspan fill="#ff544c">import</tspan><tspan fill="#dcd0b5"> annotations</tspan></text>
<text x="18" y="143.8" xml:space="preserve"><tspan fill="#5e574a"> 4 </tspan></text>
<text x="18" y="164.8" xml:space="preserve"><tspan fill="#5e574a"> 5 </tspan><tspan fill="#ff544c">import</tspan><tspan fill="#dcd0b5"> random</tspan></text>
<text x="18" y="185.8" xml:space="preserve"><tspan fill="#5e574a"> 6 </tspan><tspan fill="#ff544c">import</tspan><tspan fill="#dcd0b5"> time</tspan></text>
<text x="18" y="206.8" xml:space="preserve"><tspan fill="#5e574a"> 7 </tspan><tspan fill="#ff544c">from</tspan><tspan fill="#dcd0b5"> dataclasses </tspan><tspan fill="#ff544c">import</tspan><tspan fill="#dcd0b5"> dataclass, field</tspan></text>
<text x="18" y="227.8" xml:space="preserve"><tspan fill="#5e574a"> 8 </tspan></text>
<text x="18" y="248.8" xml:space="preserve"><tspan fill="#5e574a"> 9 </tspan><tspan fill="#dcd0b5">MAX_ATTEMPTS = </tspan><tspan fill="#cc77df">5</tspan></text>
<text x="18" y="269.8" xml:space="preserve"><tspan fill="#5e574a">10 </tspan><tspan fill="#dcd0b5">BASE_DELAY = </tspan><tspan fill="#cc77df">0.25</tspan></text>
<text x="18" y="290.8" xml:space="preserve"><tspan fill="#5e574a">11 </tspan></text>
<text x="18" y="311.8" xml:space="preserve"><tspan fill="#5e574a">12 </tspan></text>
<text x="18" y="332.8" xml:space="preserve"><tspan fill="#5e574a">13 </tspan><tspan fill="#f9ad26">@</tspan><tspan fill="#8def46">dataclass</tspan><tspan fill="#dcd0b5">(slots=</tspan><tspan fill="#8def46">True</tspan><tspan fill="#dcd0b5">)</tspan></text>
<text x="18" y="353.8" xml:space="preserve"><tspan fill="#5e574a">14 </tspan><tspan fill="#ff544c">class</tspan><tspan fill="#dcd0b5"> </tspan><tspan fill="#2ad7d7">RetryPolicy</tspan><tspan fill="#dcd0b5">:</tspan></text>
<text x="18" y="374.8" xml:space="preserve"><tspan fill="#5e574a">15 </tspan><tspan fill="#dcd0b5">    attempts: </tspan><tspan fill="#2ad7d7">int</tspan><tspan fill="#dcd0b5"> = MAX_ATTEMPTS</tspan></text>
<text x="18" y="395.8" xml:space="preserve"><tspan fill="#5e574a">16 </tspan><tspan fill="#dcd0b5">    base: </tspan><tspan fill="#2ad7d7">float</tspan><tspan fill="#dcd0b5"> = BASE_DELAY</tspan></text>
<text x="18" y="416.8" xml:space="preserve"><tspan fill="#5e574a">17 </tspan><tspan fill="#dcd0b5">    retry_on: </tspan><tspan fill="#2ad7d7">tuple</tspan><tspan fill="#dcd0b5">[</tspan><tspan fill="#2ad7d7">type</tspan><tspan fill="#dcd0b5">[</tspan><tspan fill="#2ad7d7">Exception</tspan><tspan fill="#dcd0b5">], </tspan><tspan fill="#2ad7d7">...</tspan><tspan fill="#dcd0b5">] = (</tspan><tspan fill="#2ad7d7">TimeoutError</tspan><tspan fill="#dcd0b5">, </tspan><tspan fill="#2ad7d7">ConnectionError</tspan><tspan fill="#dcd0b5">)</tspan></text>
<text x="18" y="437.8" xml:space="preserve"><tspan fill="#5e574a">18 </tspan><tspan fill="#dcd0b5">    _clock: </tspan><tspan fill="#2ad7d7">callable</tspan><tspan fill="#dcd0b5"> = field(default=time.monotonic, </tspan><tspan fill="#2ad7d7">repr</tspan><tspan fill="#dcd0b5">=</tspan><tspan fill="#8def46">False</tspan><tspan fill="#dcd0b5">)</tspan></text>
<text x="18" y="458.8" xml:space="preserve"><tspan fill="#5e574a">19 </tspan></text>
<text x="18" y="479.8" xml:space="preserve"><tspan fill="#5e574a">20 </tspan><tspan fill="#dcd0b5">    </tspan><tspan fill="#f9ad26">@</tspan><tspan fill="#8def46">property</tspan></text>
<text x="18" y="500.8" xml:space="preserve"><tspan fill="#5e574a">21 </tspan><tspan fill="#dcd0b5">    </tspan><tspan fill="#ff544c">def</tspan><tspan fill="#dcd0b5"> </tspan><tspan fill="#8def46">max_delay</tspan><tspan fill="#dcd0b5">(</tspan><tspan fill="#dcd0b5">self</tspan><tspan fill="#dcd0b5">) -&gt; </tspan><tspan fill="#2ad7d7">float</tspan><tspan fill="#dcd0b5">:</tspan></text>
<text x="18" y="521.8" xml:space="preserve"><tspan fill="#5e574a">22 </tspan><tspan fill="#dcd0b5">        </tspan><tspan fill="#f8d700">"""</tspan><tspan fill="#f8d700">Longest wait this policy can produce, for logging and tests.</tspan><tspan fill="#f8d700">"""</tspan></text>
<text x="18" y="542.8" xml:space="preserve"><tspan fill="#5e574a">23 </tspan><tspan fill="#dcd0b5">        </tspan><tspan fill="#ff544c">return</tspan><tspan fill="#dcd0b5"> </tspan><tspan fill="#dcd0b5">self</tspan><tspan fill="#dcd0b5">.base * (</tspan><tspan fill="#cc77df">2</tspan><tspan fill="#dcd0b5"> ** (</tspan><tspan fill="#dcd0b5">self</tspan><tspan fill="#dcd0b5">.attempts - </tspan><tspan fill="#cc77df">1</tspan><tspan fill="#dcd0b5">))</tspan></text>
<text x="18" y="563.8" xml:space="preserve"><tspan fill="#5e574a">24 </tspan></text>
<text x="18" y="584.8" xml:space="preserve"><tspan fill="#5e574a">25 </tspan><tspan fill="#dcd0b5">    </tspan><tspan fill="#ff544c">def</tspan><tspan fill="#dcd0b5"> </tspan><tspan fill="#8def46">delay_for</tspan><tspan fill="#dcd0b5">(</tspan><tspan fill="#dcd0b5">self</tspan><tspan fill="#dcd0b5">, attempt: </tspan><tspan fill="#2ad7d7">int</tspan><tspan fill="#dcd0b5">) -&gt; </tspan><tspan fill="#2ad7d7">float</tspan><tspan fill="#dcd0b5">:</tspan></text>
<text x="18" y="605.8" xml:space="preserve"><tspan fill="#5e574a">26 </tspan><tspan fill="#dcd0b5">        </tspan><tspan fill="#f8d700">"""</tspan><tspan fill="#f8d700">Full-jitter backoff: uniform over [0, base * 2**attempt].</tspan><tspan fill="#f8d700">"""</tspan></text>
<text x="18" y="626.8" xml:space="preserve"><tspan fill="#5e574a">27 </tspan><tspan fill="#dcd0b5">        </tspan><tspan fill="#ff544c">if</tspan><tspan fill="#dcd0b5"> attempt &lt; </tspan><tspan fill="#cc77df">0</tspan><tspan fill="#dcd0b5">:</tspan></text>
<text x="18" y="647.8" xml:space="preserve"><tspan fill="#5e574a">28 </tspan><tspan fill="#dcd0b5">            </tspan><tspan fill="#ff544c">raise</tspan><tspan fill="#dcd0b5"> </tspan><tspan fill="#2ad7d7">ValueError</tspan><tspan fill="#dcd0b5">(</tspan><tspan fill="#f8d700">f"</tspan><tspan fill="#f8d700">attempt must be non-negative, got </tspan><tspan fill="#2ad7d7">{</tspan><tspan fill="#dcd0b5">attempt</tspan><tspan fill="#2ad7d7">!r}</tspan><tspan fill="#f8d700">"</tspan><tspan fill="#dcd0b5">)</tspan></text>
<text x="18" y="668.8" xml:space="preserve"><tspan fill="#5e574a">29 </tspan><tspan fill="#dcd0b5">        </tspan><tspan fill="#ff544c">return</tspan><tspan fill="#dcd0b5"> random.uniform(</tspan><tspan fill="#cc77df">0.0</tspan><tspan fill="#dcd0b5">, </tspan><tspan fill="#dcd0b5">self</tspan><tspan fill="#dcd0b5">.base * (</tspan><tspan fill="#cc77df">2</tspan><tspan fill="#dcd0b5"> ** attempt))</tspan></text>
<text x="18" y="689.8" xml:space="preserve"><tspan fill="#5e574a">30 </tspan></text>
<text x="18" y="710.8" xml:space="preserve"><tspan fill="#5e574a">31 </tspan><tspan fill="#dcd0b5">    </tspan><tspan fill="#ff544c">def</tspan><tspan fill="#dcd0b5"> </tspan><tspan fill="#8def46">call</tspan><tspan fill="#dcd0b5">(</tspan><tspan fill="#dcd0b5">self</tspan><tspan fill="#dcd0b5">, fn, *args, **kwargs):</tspan></text>
<text x="18" y="731.8" xml:space="preserve"><tspan fill="#5e574a">32 </tspan><tspan fill="#dcd0b5">        last = </tspan><tspan fill="#8def46">None</tspan></text>
<text x="18" y="752.8" xml:space="preserve"><tspan fill="#5e574a">33 </tspan><tspan fill="#dcd0b5">        </tspan><tspan fill="#ff544c">for</tspan><tspan fill="#dcd0b5"> attempt </tspan><tspan fill="#ff544c">in</tspan><tspan fill="#dcd0b5"> </tspan><tspan fill="#2ad7d7">range</tspan><tspan fill="#dcd0b5">(</tspan><tspan fill="#dcd0b5">self</tspan><tspan fill="#dcd0b5">.attempts):</tspan></text>
<text x="18" y="773.8" xml:space="preserve"><tspan fill="#5e574a">34 </tspan><tspan fill="#dcd0b5">            </tspan><tspan fill="#ff544c">try</tspan><tspan fill="#dcd0b5">:</tspan></text>
<text x="18" y="794.8" xml:space="preserve"><tspan fill="#5e574a">35 </tspan><tspan fill="#dcd0b5">                </tspan><tspan fill="#ff544c">return</tspan><tspan fill="#dcd0b5"> fn(*args, **kwargs)</tspan></text>
<text x="18" y="815.8" xml:space="preserve"><tspan fill="#5e574a">36 </tspan><tspan fill="#dcd0b5">            </tspan><tspan fill="#ff544c">except</tspan><tspan fill="#dcd0b5"> </tspan><tspan fill="#dcd0b5">self</tspan><tspan fill="#dcd0b5">.retry_on </tspan><tspan fill="#ff544c">as</tspan><tspan fill="#dcd0b5"> exc:</tspan></text>
<text x="18" y="836.8" xml:space="preserve"><tspan fill="#5e574a">37 </tspan><tspan fill="#dcd0b5">                last = exc</tspan></text>
<text x="18" y="857.8" xml:space="preserve"><tspan fill="#5e574a">38 </tspan><tspan fill="#dcd0b5">                time.sleep(</tspan><tspan fill="#dcd0b5">self</tspan><tspan fill="#dcd0b5">.delay_for(attempt))</tspan></text>
<text x="18" y="878.8" xml:space="preserve"><tspan fill="#5e574a">39 </tspan><tspan fill="#dcd0b5">        </tspan><tspan fill="#ff544c">raise</tspan><tspan fill="#dcd0b5"> </tspan><tspan fill="#2ad7d7">RuntimeError</tspan><tspan fill="#dcd0b5">(</tspan><tspan fill="#f8d700">"</tspan><tspan fill="#f8d700">retries exhausted</tspan><tspan fill="#f8d700">"</tspan><tspan fill="#dcd0b5">) </tspan><tspan fill="#ff544c">from</tspan><tspan fill="#dcd0b5"> last</tspan></text>
</svg>
